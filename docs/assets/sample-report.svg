<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Sample dbreport HTML report layout</title>
  <desc id="desc">Stylized preview of authentication login reporting widgets and charts.</desc>
  <rect width="900" height="540" fill="#f5f7fb"/>
  <rect x="24" y="20" width="852" height="54" rx="8" fill="#1f2937"/>
  <text x="40" y="54" fill="#ffffff" font-family="Arial, sans-serif" font-size="22">Authentication Login Activity Report</text>
  <g fill="#ffffff" font-family="Arial, sans-serif" font-size="12" opacity="0.85">
    <text x="40" y="90" fill="#334155">Metrics</text>
  </g>
  <g>
    <rect x="24" y="98" width="200" height="84" rx="8" fill="#e2e8f0"/>
    <rect x="240" y="98" width="200" height="84" rx="8" fill="#e2e8f0"/>
    <rect x="456" y="98" width="200" height="84" rx="8" fill="#e2e8f0"/>
    <rect x="672" y="98" width="204" height="84" rx="8" fill="#e2e8f0"/>
  </g>
  <text x="36" y="130" fill="#0f172a" font-size="12" font-family="Arial">Total Users</text>
  <text x="36" y="162" fill="#0f172a" font-size="26" font-family="Arial">24</text>
  <text x="252" y="130" fill="#0f172a" font-size="12" font-family="Arial">Total Login Attempts</text>
  <text x="252" y="162" fill="#0f172a" font-size="26" font-family="Arial">240</text>
  <text x="468" y="130" fill="#0f172a" font-size="12" font-family="Arial">Failed Login Count</text>
  <text x="468" y="162" fill="#0f172a" font-size="26" font-family="Arial">61</text>
  <text x="684" y="130" fill="#0f172a" font-size="12" font-family="Arial">Successful Login Count</text>
  <text x="684" y="162" fill="#0f172a" font-size="26" font-family="Arial">179</text>

  <rect x="24" y="200" width="408" height="314" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="230" fill="#0f172a" font-size="14" font-family="Arial">Last Logins by User</text>
  <g fill="#64748b" font-family="Arial" font-size="11">
    <text x="40" y="252">full_name  username  email  last_login_time  last_result</text>
    <text x="40" y="274">Avery Holt  aholt  avery.holt@example.invalid  2026-03-02  ...</text>
    <text x="40" y="294">Jordan Pike jpike  jordan.pike@test.invalid   2026-03-02  ...</text>
    <text x="40" y="314">…</text>
  </g>

  <rect x="448" y="200" width="428" height="148" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="464" y="230" fill="#0f172a" font-size="14" font-family="Arial">Successful vs Failed Logins</text>
  <rect x="474" y="285" width="140" height="20" fill="#3b82f6"/>
  <rect x="474" y="314" width="62" height="20" fill="#ef4444"/>
  <text x="620" y="300" fill="#0f172a" font-size="11" font-family="Arial">success</text>
  <text x="540" y="329" fill="#0f172a" font-size="11" font-family="Arial">failure</text>

  <rect x="448" y="366" width="206" height="148" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="462" y="394" fill="#0f172a" font-size="14" font-family="Arial">Top Browsers Used</text>
  <rect x="464" y="410" width="124" height="10" fill="#2563eb"/>
  <rect x="464" y="428" width="102" height="10" fill="#2563eb"/>
  <rect x="464" y="446" width="88" height="10" fill="#2563eb"/>

  <rect x="670" y="366" width="206" height="148" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="684" y="394" fill="#0f172a" font-size="14" font-family="Arial">Top Countries Logged in From</text>
  <rect x="686" y="410" width="122" height="10" fill="#0ea5e9"/>
  <rect x="686" y="428" width="110" height="10" fill="#0ea5e9"/>
  <rect x="686" y="446" width="94" height="10" fill="#0ea5e9"/>
</svg>
