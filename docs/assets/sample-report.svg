<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">Sample dbreport HTML report preview</title>
  <desc id="desc">Static preview matching the generated authentication login activity report layout.</desc>
  <rect width="1100" height="760" fill="#f1f5f9"/>
  <rect x="24" y="20" width="1052" height="64" rx="10" fill="#0f172a"/>
  <text x="44" y="59" fill="#ffffff" font-family="Arial, sans-serif" font-size="26">Authentication Login Activity Report</text>

  <g font-family="Arial, sans-serif">
