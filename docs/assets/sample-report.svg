    <text x="40" y="136" font-size="14" fill="#1e3a8a">Total Users</text>
    <text x="40" y="171" font-size="30" fill="#0f172a">24</text>

    <rect x="290" y="104" width="250" height="88" rx="8" fill="#dbeafe"/>
    <text x="306" y="136" font-size="14" fill="#1e3a8a">Total Login Attempts</text>
    <text x="306" y="171" font-size="30" fill="#0f172a">240</text>

